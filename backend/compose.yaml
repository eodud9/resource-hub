services:
  app:
    build: .
    container_name: resourcehub-app

    ports:
      - "8080:8080"

    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/resourcehub
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    container_name: resourcehub-mysql

    environment:
      MYSQL_DATABASE: resourcehub
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: resourcehub-redis

    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.3.1
    container_name: resourcehub-kafka

    ports:
      - "9092:9092"

volumes:
  mysql-data: