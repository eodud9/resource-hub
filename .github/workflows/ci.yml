name: Resourcehub CI

on:
 push:
  branches:
   - main

jobs:
 test:
  runs-on: ubuntu-latest

  permissions:
    contents: read
    packages: write
    id-token: write

  services:
    mysql:
      image: mysql:8.4
      env:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: resourcehub
      ports:
        - 3306:3306
      options: >-
        --health-cmd="mysqladmin ping -h localhost -proot"
        --health-interval=10s
        --health-timeout=5s
        --health-retries=5

  steps:
   - name: Checkout source
     uses: actions/checkout@v4

   - name: Set up Java 21
     uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '21'

   - name: Grant execute permission for Gradle
     working-directory: backend
     run: chmod +x gradlew

   - name: Run tests
     working-directory: backend
     env:
       SPRING_DATASOURCE_USERNAME: root
       SPRING_DATASOURCE_PASSWORD: root
       JWT_SECRET: ${{ secrets.JWT_SECRET }}
     run: ./gradlew test

   - name: Log in to GHCR
     uses: docker/login-action@v3
     with:
       registry: ghcr.io
       username: ${{ github.actor }}
       password: ${{ secrets.GITHUB_TOKEN }}

   - name: Build and push Docker image
     uses: docker/build-push-action@v6
     with:
       context: ./backend
       push: true
       tags: ghcr.io/${{ github.repository_owner }}/resourcehub:latest

   - name: Check OIDC subject
     shell: bash
     run: |
       TOKEN_RESPONSE=$(curl -sS \
         -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
         "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

       TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

       PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
       PAYLOAD="${PAYLOAD//-/+}"
       PAYLOAD="${PAYLOAD//_/\/}"

       case $((${#PAYLOAD} % 4)) in
         2) PAYLOAD="${PAYLOAD}==" ;;
         3) PAYLOAD="${PAYLOAD}=" ;;
       esac

       echo "$PAYLOAD" | base64 --decode | jq '{sub, aud}'

   - name: Configure AWS credentials
     uses: aws-actions/configure-aws-credentials@v6
     with:
       role-to-assume: ${{ vars.AWS_ROLE_ARN }}
       aws-region: ap-northeast-2

   - name: Deploy to EC2
     uses: appleboy/ssh-action@v1
     with:
       host: ${{ secrets.EC2_HOST }}
       username: ${{ secrets.EC2_USER }}
       key: ${{ secrets.EC2_SSH_KEY }}
       script: |
         cd ~/resource-hub
         git pull origin main
         cd backend
         docker compose -f docker-compose.prod.yaml pull app
         docker compose -f docker-compose.prod.yaml up -d app
         docker compose -f docker-compose.prod.yaml restart nginx
