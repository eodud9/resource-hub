name: Resourcehub CI

on:
 push:
  branches:
   - main

jobs:
 test:
  runs-on: ubuntu-latest

  steps:
   - name: Checkout source
     uses: actions/checkout@v4

   - name: Set up Java 21
     uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '21'

   - name: Grant execute permission for Gradle
     working-directory: backend
     run: chmod +x gradlew

   - name: Run tests
     working-directory: backend
     run: ./gradlew test
